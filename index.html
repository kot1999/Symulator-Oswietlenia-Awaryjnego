<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Symulator LZN LF SLENDER & Federal Signal AS 422 Polonia</title>

    <!-- Ikonka w pasku przeglądarki (wbudowana ikona SVG + obsługa pliku favicon.png/ico) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2316171a'/%3E%3Crect x='14' y='44' width='36' height='7' rx='2.5' fill='%239aa5b4'/%3E%3Cpath d='M19 44L21 23C21 13 43 13 43 23L45 44Z' fill='%230066ff' stroke='%2366b2ff' stroke-width='2.5'/%3E%3Cpath d='M32 16C38 16 42 18.5 42 23L43.5 44H32Z' fill='%230044b5'/%3E%3Cline x1='7' y1='17' x2='15' y2='21' stroke='%233399ff' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='5' y1='28' x2='13' y2='29' stroke='%233399ff' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='7' y1='39' x2='15' y2='37' stroke='%233399ff' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='57' y1='17' x2='49' y2='21' stroke='%233399ff' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='59' y1='28' x2='51' y2='29' stroke='%233399ff' stroke-width='3.5' stroke-linecap='round'/%3E%3Cline x1='57' y1='39' x2='49' y2='37' stroke='%233399ff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="alternate icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <style>
        * {
            -webkit-touch-callout: none; /* Blokuje menu na iOS/Android */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #16171a;
            background-image: radial-gradient(circle at 35% 50%, #1e2128 0%, #121316 75%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Arial Narrow', Arial, sans-serif;
            touch-action: none; /* Całkowicie blokuje gesty przeglądarki przy trzymaniu palca */
            overflow: hidden;
            color: #cfd6e0;
        }

        /* Główny układ: Belka po lewej, Pilot po prawej */
        .simulator-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1360px;
            padding: 20px 40px;
            gap: 48px;
            box-sizing: border-box;
        }

        /* =========================================================
           LEWA STRONA: SYMULATOR BELKI ELEKTRA LZN LF SLENDER
           ========================================================= */
        .lightbar-stage,
        .lightbar-stage * {
            box-sizing: border-box;
        }

        .lightbar-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 420px;
        }

        /* Poświata otoczenia rzucana przez belkę */
        .ambient-glow {
            position: absolute;
            height: 260px;
            border-radius: 50%;
            filter: blur(65px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.06s ease;
            z-index: 0;
        }
        .ambient-left {
            left: -5%;
            width: 52%;
            background: radial-gradient(circle, rgba(0, 110, 255, 0.65) 0%, transparent 70%);
        }
        .ambient-right {
            right: -5%;
            width: 48%;
            background: radial-gradient(circle, rgba(0, 110, 255, 0.65) 0%, transparent 70%);
        }
        .ambient-red {
            left: 48%;
            width: 32%;
            background: radial-gradient(circle, rgba(255, 20, 20, 0.7) 0%, transparent 70%);
        }

        /* Stożki światła bocznego (Alley Lights) */
        .alley-beam {
            position: absolute;
            top: 50%;
            width: 240px;
            height: 150px;
            transform: translateY(-58%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 1;
            filter: blur(8px);
        }
        .alley-beam.left {
            right: calc(100% - 35px);
            background: linear-gradient(270deg, rgba(255, 255, 255, 0.85) 0%, rgba(210, 235, 255, 0.25) 45%, transparent 100%);
            clip-path: polygon(100% 38%, 0 0, 0 100%, 100% 62%);
        }
        .alley-beam.right {
            left: calc(100% - 35px);
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.85) 0%, rgba(210, 235, 255, 0.25) 45%, transparent 100%);
            clip-path: polygon(0 38%, 100% 0, 100% 100%, 0 62%);
        }
        .alley-beam.on {
            opacity: 1;
        }

        /* Główny kontener belki LZN LF SLENDER (zachowane proporcje) */
        .lzn-wrapper {
            position: relative;
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        /* Górna pokrywa niskoprofilowa */
        .lzn-top-cap {
            width: 96%;
            height: 12px;
            background: linear-gradient(90deg, #1b1d21 0%, #383c44 20%, #525863 50%, #383c44 80%, #1b1d21 100%);
            border-radius: 28px 28px 0 0;
            border: 1px solid #0d0e10;
            border-bottom: none;
            box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.25);
        }

        /* Korpus belki:
           [Lewy klosz niebieski] [Bezbarwny L] [POLICJA] [Czerwony klosz PILOT] [Bezbarwny P] [Prawy klosz niebieski] */
        .lzn-body {
            width: 100%;
            height: 78px;
            background: #141619;
            border-radius: 16px;
            display: grid;
            grid-template-columns: 2.55fr 0.55fr 184px 0.85fr 0.55fr 1.7fr;
            overflow: hidden;
            position: relative;
            border: 2px solid #0c0d0f;
            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.85),
                inset 0 2px 4px rgba(255, 255, 255, 0.15),
                inset 0 -3px 6px rgba(0, 0, 0, 0.9);
        }

        /* Ryflowanie klosza poliwęglanowego (linie optyczne Fresnela na całej belce) */
        .lzn-body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.045) 0px,
                rgba(255, 255, 255, 0.045) 2px,
                transparent 2px,
                transparent 5px
            ),
            linear-gradient(180deg, rgba(255,255,255,0.18) 0%, transparent 28%, rgba(0,0,0,0.38) 100%);
            pointer-events: none;
            z-index: 6;
        }

        /* Pionowe uszczelki dzielące klosze */
        .lens-section {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 6px;
            gap: 6px;
            border-right: 2px solid #0b0c0e;
        }
        .lens-section:last-child {
            border-right: none;
        }

        /* STAŁY KLOSZ NIEBIESKI (sekcje boczne) */
        .lens-blue-tint {
            background: linear-gradient(180deg, #0d2c63 0%, #081d42 50%, #051129 100%);
            box-shadow: inset 0 0 12px rgba(0, 80, 255, 0.25);
        }

        /* STAŁY KLOSZ CZERWONY (sekcja PILOT po prawej stronie napisu POLICJA) */
        .lens-red-tint {
            background: linear-gradient(180deg, #7a0c14 0%, #52060c 50%, #300307 100%);
            box-shadow: inset 0 0 12px rgba(255, 20, 20, 0.25);
        }

        /* KLOSZ BEZBARWNY (wąskie okienka reflektorów roboczych przednich) */
        .lens-clear-tint {
            background: linear-gradient(180deg, #232830 0%, #16191f 50%, #0e1014 100%);
        }

        /* Moduł LED MD3 (3 soczewki kolimatorowe w rzędzie) */
        .md3-module {
            flex: 1;
            height: 44px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 4px;
            position: relative;
            transition: background 0.05s ease, box-shadow 0.05s ease, border-color 0.05s ease;
        }

        /* Wygląd spoczynkowy modułu pod niebieskim kloszem */
        .lens-blue-tint .md3-module {
            background: linear-gradient(180deg, #091e42 0%, #102a59 50%, #071530 100%);
            border: 1px solid #1e4587;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85);
        }

        /* Wygląd spoczynkowy modułu pod stałym czerwonym kloszem */
        .lens-red-tint .md3-module {
            background: linear-gradient(180deg, #42080d 0%, #5e0e15 50%, #2e0408 100%);
            border: 1px solid #8c1d26;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.85);
        }

        /* Pojedyncza dioda LED z soczewką */
        .led-diode {
            width: 22px;
            height: 28px;
            border-radius: 5px;
            position: relative;
            transition: all 0.05s ease;
        }
        .lens-blue-tint .led-diode {
            background: radial-gradient(circle at 50% 50%, #2b579a 0%, #122952 65%, #08152e 100%);
            border: 1px solid #2e5ca3;
            box-shadow: inset 0 1px 3px rgba(140, 190, 255, 0.25);
        }
        .lens-red-tint .led-diode {
            background: radial-gradient(circle at 50% 50%, #9e202b 0%, #540c12 65%, #2b0508 100%);
            border: 1px solid #ab2934;
            box-shadow: inset 0 1px 3px rgba(255, 150, 150, 0.25);
        }

        .led-diode::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }
        .lens-blue-tint .led-diode::after {
            background: #1a3a6e;
        }
        .lens-red-tint .led-diode::after {
            background: #6e151d;
        }

        /* STAN AKTYWNY: Niebieski moduł MD3 */
        .md3-module.blue-on {
            background: #0066ff !important;
            border-color: #99ccff !important;
            box-shadow:
                0 0 25px 6px rgba(0, 110, 255, 0.95),
                0 0 55px 15px rgba(0, 80, 255, 0.65),
                inset 0 0 12px #ffffff !important;
            z-index: 5;
        }
        .md3-module.blue-on .led-diode {
            background: radial-gradient(circle, #ffffff 0%, #80bfff 45%, #0066ff 100%) !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 12px #ffffff !important;
        }
        .md3-module.blue-on .led-diode::after {
            background: #ffffff !important;
        }

        /* STAN CRUISE (podświetlenie postojowe - aktywne tylko przy wyłączonym świetle głównym) */
        .md3-module.cruise-on:not(.blue-on) {
            background: rgba(0, 95, 255, 0.48) !important;
            border-color: #55aaff !important;
            box-shadow:
                0 0 16px 3px rgba(0, 110, 255, 0.6),
                inset 0 0 6px rgba(200, 230, 255, 0.5) !important;
        }
        .md3-module.cruise-on:not(.blue-on) .led-diode {
            background: radial-gradient(circle, #cce6ff 0%, #2b7fff 55%, #10397a 100%) !important;
            border-color: #80bfff !important;
            box-shadow: 0 0 6px rgba(128, 191, 255, 0.7) !important;
        }
        .md3-module.cruise-on:not(.blue-on) .led-diode::after {
            background: #d9ecff !important;
        }

        /* STAN AKTYWNY: Czerwony moduł PILOT (pod czerwonym kloszem) */
        .md3-module.red-on {
            background: #ff1a1a !important;
            border-color: #ffb3b3 !important;
            box-shadow:
                0 0 25px 6px rgba(255, 20, 20, 0.95),
                0 0 55px 15px rgba(255, 0, 0, 0.65),
                inset 0 0 12px #ffffff !important;
            z-index: 5;
        }
        .md3-module.red-on .led-diode {
            background: radial-gradient(circle, #ffffff 0%, #ff8080 45%, #ff0000 100%) !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 12px #ffffff !important;
        }
        .md3-module.red-on .led-diode::after {
            background: #ffffff !important;
        }

        /* Białe lampy robocze (Takedown w bezbarwnych okienkach oraz Alley na bokach) */
        .work-light {
            width: 100%;
            height: 44px;
            background: linear-gradient(180deg, #1b1f26 0%, #282d36 50%, #15181d 100%);
            border: 1px solid #454e5e;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 3px;
            transition: all 0.1s ease;
        }
        .work-light.side-alley {
            width: 34px;
            flex-shrink: 0;
        }
        .work-light .led-diode {
            width: 18px;
            height: 26px;
            background: radial-gradient(circle at 50% 50%, #5c6678 0%, #262c36 65%, #12151a 100%) !important;
            border: 1px solid #4a5464 !important;
        }
        .work-light .led-diode::after {
            background: #6b613b !important;
        }
        .work-light.white-on {
            background: #ffffff !important;
            border-color: #ffffff !important;
            box-shadow:
                0 0 30px 10px rgba(255, 255, 255, 0.95),
                0 0 65px 22px rgba(210, 235, 255, 0.75),
                inset 0 0 15px #ffffff !important;
            z-index: 5;
        }
        .work-light.white-on .led-diode {
            background: radial-gradient(circle, #ffffff 0%, #eef7ff 60%, #cfe8ff 100%) !important;
            border-color: #ffffff !important;
            box-shadow: 0 0 14px #ffffff !important;
        }
        .work-light.white-on .led-diode::after {
            background: #ffffff !important;
        }

        /* Środkowy kaseton podświetlany WL (Napis POLICJA) */
        .center-wl-panel {
            background: linear-gradient(180deg, #d0d7e0 0%, #eef2f7 50%, #c2cbd6 100%);
            border-left: 3px solid #0c0d10;
            border-right: 3px solid #0c0d10;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        .center-wl-panel.illuminated {
            background: radial-gradient(circle, #ffffff 0%, #f5f9ff 70%, #dcebff 100%);
            box-shadow:
                0 0 30px 5px rgba(255, 255, 255, 0.85),
                inset 0 0 15px rgba(255, 255, 255, 1);
            z-index: 4;
        }
        .wl-text {
            font-family: 'Arial Black', Impact, sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2.5px;
            color: #003380;
            text-shadow: 0 1px 0 rgba(255,255,255,0.5);
            z-index: 7;
            transition: color 0.15s ease, text-shadow 0.15s ease;
        }
        .center-wl-panel.illuminated .wl-text {
            color: #003ea1;
            text-shadow: 0 0 8px rgba(0, 102, 255, 0.45);
        }

        /* Dolny profil aluminiowy belki */
        .lzn-bottom-rail {
            width: 98%;
            height: 14px;
            background: linear-gradient(180deg, #2b2f36 0%, #17191d 60%, #0d0e11 100%);
            border-radius: 0 0 10px 10px;
            border: 1px solid #090a0c;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.7);
        }
        .elektra-badge {
            font-size: 9px;
            letter-spacing: 1.5px;
            color: #7c8594;
            font-weight: bold;
        }

        /* Stopy montażowe na dach */
        .lzn-mounts {
            width: 82%;
            display: flex;
            justify-content: space-between;
        }
        .mount-foot {
            width: 86px;
            height: 22px;
            background: linear-gradient(90deg, #121316, #262930, #121316);
            clip-path: polygon(12% 0, 88% 0, 100% 100%, 0 100%);
            border-bottom: 4px solid #090a0b;
        }

        /* Panel informacyjny pod belką (stała wysokość i szerokość elementów) */
        .status-bar {
            margin-top: 38px;
            background: rgba(20, 22, 26, 0.9);
            border: 1px solid #282c34;
            border-radius: 12px;
            padding: 11px 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px 22px;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .status-item {
            display: inline-flex;
            align-items: center;
            height: 20px;
            line-height: 20px;
            gap: 8px;
            font-size: 13px;
            color: #8c96a5;
            white-space: nowrap;
        }
        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #2d323b;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }
        .status-dot.active-blue {
            background: #0077ff;
            box-shadow: 0 0 8px #0077ff;
        }
        .status-dot.active-red {
            background: #ff2222;
            box-shadow: 0 0 8px #ff2222;
        }
        .status-dot.active-white {
            background: #ffffff;
            box-shadow: 0 0 8px #ffffff;
        }
        .status-dot.active-amber {
            background: #ffaa00;
            box-shadow: 0 0 8px #ffaa00;
        }

        /* Kontener utrzymujący stałą szerokość i wysokość przy przełączaniu napisu Postojowe <-> AH -> Robocze Przód */
        .status-label-stack {
            display: inline-grid;
            align-items: center;
            height: 20px;
        }
        .status-label-stack > span {
            grid-area: 1 / 1;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            height: 20px;
            line-height: 20px;
            white-space: nowrap;
        }
        .status-label-hidden {
            visibility: hidden;
            pointer-events: none;
        }

        /* Wyśrodkowana w pionie strzałka SVG */
        .status-arrow {
            width: 14px;
            height: 12px;
            display: block;
            flex-shrink: 0;
        }

        /* =========================================================
           PRAWA STRONA: ORYGINALNY PILOT FEDERAL SIGNAL AS 422 POLONIA
           (Zachowane w 100% oryginalne wymiary i proporcje z kodu)
           ========================================================= */
        .remote-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-shrink: 0;
        }

        /* Główna obudowa pilota */
        .remote {
            width: 196px;
            background: linear-gradient(145deg, #323438 0%, #222326 50%, #18191b 100%);
            padding: 18px 20px 24px 20px;
            border-radius: 26px;
            position: relative;
            box-shadow: 
                inset 2px 3px 5px rgba(255, 255, 255, 0.18),
                inset -3px -5px 8px rgba(0, 0, 0, 0.8),
                0 25px 50px rgba(0, 0, 0, 0.85);
            border: 1px solid #111;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Wewnętrzne przetłoczenie obudowy */
        .remote::before {
            content: "";
            position: absolute;
            top: 8px;
            bottom: 10px;
            left: 10px;
            right: 10px;
            border-radius: 18px;
            pointer-events: none;
            box-shadow: 
                inset 0 2px 6px rgba(0, 0, 0, 0.65),
                0 1px 1px rgba(255, 255, 255, 0.07);
        }

        /* Maskownica głośnika na górze (trapez zwężający się w dół) */
        .speaker-recess {
            background: linear-gradient(180deg, #1b1c1e 0%, #292a2e 100%);
            padding: 6px 14px;
            border-radius: 6px 6px 12px 12px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 
                inset 0 3px 5px rgba(0,0,0,0.9),
                0 1px 1px rgba(255,255,255,0.1);
            z-index: 1;
        }

        .grill-line {
            background: #09090a;
            height: 5px;
            border-radius: 3px;
            box-shadow: 
                inset 0 2px 3px #000,
                0 1px 0 rgba(255,255,255,0.12);
        }
        .grill-line:nth-child(1) { width: 68px; }
        .grill-line:nth-child(2) { width: 58px; }
        .grill-line:nth-child(3) { width: 48px; }

        /* Panel z gniazdami przycisków */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 14px;
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            z-index: 1;
        }

        /* Pojedyncze gniazdo (wgłębienie w plastiku) */
        .btn-well {
            background: #141517;
            padding: 4px;
            border-radius: 10px;
            box-shadow: 
                inset 0 3px 6px rgba(0,0,0,0.95),
                0 1px 1px rgba(255,255,255,0.08);
        }

        /* Silikonowy przycisk */
        .btn {
            background: radial-gradient(circle at 50% 45%, #dce8f2 0%, #c6d4e1 70%, #b3c2d1 100%);
            height: 62px;
            width: 100%;
            border-radius: 7px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            border: 1px solid #8e9ba8;
            box-shadow: 
                inset 0 2px 3px rgba(255, 255, 255, 0.9),
                inset 0 -2px 4px rgba(0, 0, 0, 0.22),
                0 3px 5px rgba(0, 0, 0, 0.7);
            transition: transform 0.06s ease, background 0.1s ease, box-shadow 0.1s ease;
            pointer-events: auto;
            touch-action: none;
        }

        .btn * {
            pointer-events: none;
        }

        .btn:active {
            transform: scale(0.96) translateY(1px);
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* Czerwone podświetlenie LED od spodu gumowego przycisku */
        .btn.active {
            background: radial-gradient(circle at 50% 50%, #ff4d4d 0%, #e61919 60%, #a80000 100%);
            border-color: #ff3333;
            box-shadow:

    <script>
        // Blokada menu kontekstowego przy długim przytrzymaniu palca na ekranie dotykowym
        window.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, { passive: false });

        // =========================================================================
        // 1. SYSTEM AUDIO (Oryginalny silnik AS 422 Polonia)
        // =========================================================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        let initPromise = null;
        const audioBuffers = {};
        const loopPoints = {}; 
        
        let isSirenActive = false;
        let isAhPressed = false;
        let currentModIndex = 0;
        const sirenModes = ['wilk', 'pies', 'leon', 'priority']; 
        const sirenNames = {
            'wilk': 'Wail (Wilk)',
            'pies': 'Yelp (Pies)',
            'leon': 'Hi-Lo (Leon)',
            'priority': 'Priority'
        };

        let currentSirenSource = null;
        let currentHornSource = null;

        // Korektor głośności dla poszczególnych ścieżek
        const volumes = {
            'wilk': 1.0,
            'pies': 1.0,
            'leon': 1.0,
            'priority': 2.5,
            'horn': 3.0
        };

        /**
         * Wyznacza punkty bezszwowej pętli dla dźwięków 'priority' oraz 'horn'
         */
        function findSeamlessLoopPoints(buffer) {
            const data = buffer.getChannelData(0);
            const sr = buffer.sampleRate;
            const winSize = Math.floor(sr * 0.02);
            const numWins = Math.floor(data.length / winSize);

            if (numWins < 10) {
                return { start: 0, end: buffer.duration };
            }

            const rms = new Float32Array(numWins);
            let maxRms = 0;
            for (let w = 0; w < numWins; w++) {
                let sum = 0;
                const offset = w * winSize;
                for (let i = 0; i < winSize; i++) {
                    const v = data[offset + i];
                    sum += v * v;
                }
                rms[w] = Math.sqrt(sum / winSize);
                if (rms[w] > maxRms) maxRms = rms[w];
            }

            const threshold = maxRms * 0.45;
            let firstWin = 0;
            let lastWin = numWins - 1;
            while (firstWin < numWins && rms[firstWin] < threshold) firstWin++;
            while (lastWin > firstWin && rms[lastWin] < threshold) lastWin--;

            let startSample = firstWin * winSize;
            let endSample = (lastWin + 1) * winSize;

            const activeLen = endSample - startSample;
            const margin = Math.min(Math.floor(sr * 0.2), Math.floor(activeLen * 0.12));
            startSample += margin;
            endSample -= margin;

            const crossings = [];
            for (let i = startSample; i < endSample; i++) {
                if (data[i - 1] < 0 && data[i] >= 0) {
                    crossings.push(i);
                }
            }

            if (crossings.length < 80) {
                return { start: startSample / sr, end: endSample / sr };
            }

            const numCycles = 25;
            const startIdx = crossings[0];
            const targetPeriods = [];
            for (let k = 0; k < numCycles; k++) {
                targetPeriods.push(crossings[k + 1] - crossings[k]);
            }

            const searchStartC = Math.floor(crossings.length * 0.55);
            const searchEndC = crossings.length - numCycles - 1;
            let bestEndIdx = crossings[searchEndC];
            let bestScore = Infinity;

            for (let c = searchStartC; c <= searchEndC; c++) {
                let score = 0;
                for (let k = 0; k < numCycles; k++) {
                    const period = crossings[c + k + 1] - crossings[c + k];
                    const diff = period - targetPeriods[k];
                    score += diff * diff;
                }
                if (score < bestScore) {
                    bestScore = score;
                    bestEndIdx = crossings[c];
                }
            }

            return {
                start: startIdx / sr,
                end: bestEndIdx / sr
            };
        }

        async function loadSoundFile(name, extensions) {
            for (const ext of extensions) {
                const url = `${name}.${ext}`;
                try {
                    const response = await fetch(url);
                    if (!response.ok) continue;
                    const arrayBuffer = await response.arrayBuffer();
                    const buffer = await audioCtx.decodeAudioData(arrayBuffer);
                    audioBuffers[name] = buffer;

                    // Przycinanie pętli wykonujemy TYLKO dla plików 'priority' oraz 'horn'
                    if (name === 'priority' || name === 'horn') {
                        loopPoints[name] = findSeamlessLoopPoints(buffer);
                    }
                    return;
                } catch (e) {}
            }
            console.error(`Nie znaleziono pliku audio dla: ${name}`);
        }

        async function initAudioSystem() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (!initPromise) {
                initPromise = Promise.all([
                    loadSoundFile('wilk', ['mp3', 'wav']),
                    loadSoundFile('pies', ['mp3', 'wav']),
                    loadSoundFile('leon', ['mp3', 'wav']),
                    loadSoundFile('priority', ['wav', 'mp3']),
                    loadSoundFile('horn', ['wav', 'mp3'])
                ]);
            }
            await initPromise;
        }

        function playBuffer(bufferName, loop = true) {
            if (!audioCtx || !audioBuffers[bufferName]) return null;
            
            const source = audioCtx.createBufferSource();
            source.buffer = audioBuffers[bufferName];
            source.loop = loop;

            const gainNode = audioCtx.createGain();
            gainNode.gain.value = volumes[bufferName] || 1.0;
            
            source.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const pts = loopPoints[bufferName];
            if (loop && pts) {
                source.loopStart = pts.start;
                source.loopEnd = pts.end;
                source.start(0, pts.start);
            } else {
                source.start(0);
            }
            
            return source;
        }

        // --- OBSŁUGA SYRENY (Nutki) ---
        async function toggleSiren() {
            await initAudioSystem();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            
            const btnSiren = document.getElementById('btn-siren');
            const btnLight1 = document.getElementById('btn-light1');

            // Automatyczne włączenie koguta głównego (Kogut pusty) przy włączeniu syreny
            if (!lightState.blueMain) {
                lightState.blueMain = true;
                btnLight1.classList.add('active');
                applyStaticLights();
            }

            if (!isSirenActive) {
                isSirenActive = true;
                currentModIndex = 0; 
                btnSiren.classList.add('active');
                
                if (currentSirenSource) {
                    try { currentSirenSource.stop(); } catch(e){}
                }
                
                if (!isAhPressed) {
                    currentSirenSource = playBuffer(sirenModes[currentModIndex]);
                }
            } else {
                if (currentSirenSource) {
                    try { currentSirenSource.stop(); } catch(e){}
                    currentSirenSource = null;
                }
                
                currentModIndex = (currentModIndex + 1) % sirenModes.length;
                
                if (!isAhPressed) {
                    currentSirenSource = playBuffer(sirenModes[currentModIndex]);
                }
            }
            updateStatusBar();
        }

        // --- OBSŁUGA AIR HORN (Chwilowy - odporny na długie przytrzymanie na dotyku) ---
        const btnAh = document.getElementById('btn-ah');

        btnAh.addEventListener('touchstart', startAirHorn, { passive: false });
        btnAh.addEventListener('touchend', stopAirHorn, { passive: false });
        btnAh.addEventListener('touchcancel', stopAirHorn, { passive: false });

        btnAh.addEventListener('pointerdown', startAirHorn);
        btnAh.addEventListener('pointerup', stopAirHorn);
        btnAh.addEventListener('pointerleave', stopAirHorn);
        btnAh.addEventListener('pointercancel', stopAirHorn);

        async function startAirHorn(e) {
            if (e && e.cancelable) e.preventDefault();
            if (isAhPressed) return;
            isAhPressed = true;
            
            btnAh.classList.add('active');

            // Aktualizacja świateł (włącza Robocze przód jeśli aktywne światło główne + prawy dolny przycisk)
            applyStaticLights();
            updateStatusBar();

            await initAudioSystem();
            if (audioCtx.state === 'suspended') await audioCtx.resume();
            if (!isAhPressed) return;

            if (currentSirenSource) {
                try { currentSirenSource.stop(); } catch(e){}
                currentSirenSource = null;
            }

            if (currentHornSource) {
                try { currentHornSource.stop(); } catch(e){}
            }
            currentHornSource = playBuffer('horn', true);
        }

        function stopAirHorn(e) {
            if (e && e.cancelable) e.preventDefault();
            if (!isAhPressed) return;
            isAhPressed = false;
            
            btnAh.classList.remove('active');

            if (currentHornSource) {
                try { currentHornSource.stop(); } catch(e){}
                currentHornSource = null;
            }

            if (isSirenActive && audioCtx) {
                if (currentSirenSource) {
                    try { currentSirenSource.stop(); } catch(e){}
                }
                currentSirenSource = playBuffer(sirenModes[currentModIndex]);
            }

            // Wyłącza chwilowe Robocze przód po puszczeniu AH (jeśli nie były włączone na stałe)
            applyStaticLights();
            updateStatusBar();
        }

        // =========================================================================
        // 2. STEROWNIK OŚWIETLENIA BELKI ELEKTRA LZN LF SLENDER
        // =========================================================================
        const modBlueL1     = document.getElementById('mod-blue-l1');
        const modBlueL2     = document.getElementById('mod-blue-l2');
        const modPilotRed   = document.getElementById('mod-pilot-red');
        const modBlueR1     = document.getElementById('mod-blue-r1');
        const modTakedownL  = document.getElementById('mod-takedown-l');
        const modTakedownR  = document.getElementById('mod-takedown-r');
        const modAlleyL     = document.getElementById('mod-alley-l');
        const modAlleyR     = document.getElementById('mod-alley-r');
        const modWlPanel    = document.getElementById('mod-wl-panel');
        const beamAlleyLeft = document.getElementById('beam-alley-left');
        const beamAlleyRight= document.getElementById('beam-alley-right');
        const glowLeft      = document.getElementById('glow-left');
        const glowRight     = document.getElementById('glow-right');
        const glowRed       = document.getElementById('glow-red');

        // Napisy na centralnym kasetonie WL
        const wlTexts = ['POLICJA', 'STRAŻ', 'AMBULANS', ' SŁUŻBA '];
        let wlTextIdx = 0;
        function cycleWlText() {
            wlTextIdx = (wlTextIdx + 1) % wlTexts.length;
            document.getElementById('wl-text-content').textContent = wlTexts[wlTextIdx];
        }

        // Stan przycisków oświetlenia
        const lightState = {
            blueMain: false,   // btn-light1 (Kogut pusty - główne niebieskie MD3)
            redPilot: false,   // btn-light2 (Kogut półpełny - czerwony moduł PILOT pod czerwonym kloszem)
            takedown: false,   // btn-grill1 (Reflektory w górę - robocze przednie włączone na stałe)
            alley: false,      // btn-grill2 (Reflektory na boki - robocze boczne)
            wlPanel: false,    // btn-aux1   (Lampka sufitowa - podświetlenie kasetonu POLICJA)
            aux2: false,       // btn-aux2   (Prawy dolny przycisk: Postojowe gdy główne WYŁ / AH->Robocze przód gdy główne WŁ)
            radio: false       // btn-radio  (Mikrofon)
        };

        // --- OBSŁUGA ŚWIATEŁ ---
        function toggleLightBtn(id) {
            const btn = document.getElementById(id);
            const isActive = btn.classList.toggle('active');

            switch (id) {
                case 'btn-light1':
                    lightState.blueMain = isActive;
                    break;
                case 'btn-light2':
                    lightState.redPilot = isActive;
                    break;
                case 'btn-grill1':
                    lightState.takedown = isActive;
                    break;
                case 'btn-grill2':
                    lightState.alley = isActive;
                    break;
                case 'btn-aux1':
                    lightState.wlPanel = isActive;
                    break;
                case 'btn-aux2':
                    lightState.aux2 = isActive;
                    break;
                case 'btn-radio':
                    lightState.radio = isActive;
                    break;
            }

            applyStaticLights();
            updateStatusBar();
        }

        // --- OBSŁUGA PRZYCISKU OFF ---
        function turnOffAll() {
            isSirenActive = false;
            isAhPressed = false;
            
            if (currentSirenSource) {
                try { currentSirenSource.stop(); } catch(e){}
                currentSirenSource = null;
            }
            if (currentHornSource) {
                try { currentHornSource.stop(); } catch(e){}
                currentHornSource = null;
            }
            
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));

            Object.keys(lightState).forEach(k => lightState[k] = false);
            applyStaticLights();
            clearFlashingModules();
            updateStatusBar();
        }

        // Aktualizacja świateł ciągłych (Robocze przód, Robocze boki, Kaseton WL, Postojowe Cruise)
        function applyStaticLights() {
            // Światło postojowe działa TYLKO, gdy światło główne (blueMain) jest WYŁĄCZONE
            const isCruiseActive = lightState.aux2 && !lightState.blueMain;

            // Gdy światło główne jest WŁĄCZONE oraz prawy dolny przycisk (aux2) jest WŁĄCZONY,
            // trzymanie przycisku AH włącza przycisk i lampy "Robocze przód"
            const isAhTakedownActive = isAhPressed && lightState.blueMain && lightState.aux2;
            const effectiveTakedown = lightState.takedown || isAhTakedownActive;

            // Synchronizacja podświetlenia przycisku "Robocze przód" (btn-grill1) na pilocie
            const btnGrill1 = document.getElementById('btn-grill1');
            btnGrill1.classList.toggle('active', effectiveTakedown);

            // Przednie lampy robocze (Takedown) na belce
            modTakedownL.classList.toggle('white-on', effectiveTakedown);
            modTakedownR.classList.toggle('white-on', effectiveTakedown);

            // Boczne lampy robocze (Alley Lights)
            modAlleyL.classList.toggle('white-on', lightState.alley);
            modAlleyR.classList.toggle('white-on', lightState.alley);
            beamAlleyLeft.classList.toggle('on', lightState.alley);
            beamAlleyRight.classList.toggle('on', lightState.alley);

            // Podświetlenie kasetonu WL (POLICJA)
            modWlPanel.classList.toggle('illuminated', lightState.wlPanel);

            // Podświetlenie postojowe (Cruise) na modułach niebieskich (wyłącza się przy włączeniu głównych)
            modBlueL1.classList.toggle('cruise-on', isCruiseActive);
            modBlueL2.classList.toggle('cruise-on', isCruiseActive);
            modBlueR1.classList.toggle('cruise-on', isCruiseActive);

            if (!lightState.blueMain) {
                glowLeft.style.opacity = isCruiseActive ? '0.28' : '0';
                glowRight.style.opacity = isCruiseActive ? '0.28' : '0';
            }
        }

        function clearFlashingModules() {
            const isCruiseActive = lightState.aux2 && !lightState.blueMain;
            modBlueL1.classList.remove('blue-on');
            modBlueL2.classList.remove('blue-on');
            modBlueR1.classList.remove('blue-on');
            modPilotRed.classList.remove('red-on');
            glowLeft.style.opacity = isCruiseActive ? '0.28' : '0';
            glowRight.style.opacity = isCruiseActive ? '0.28' : '0';
            glowRed.style.opacity = '0';
        }

        function updateStatusBar() {
            const isCruiseActive = lightState.aux2 && !lightState.blueMain;
            const isAhTakedownMode = lightState.aux2 && lightState.blueMain;
            const effectiveTakedown = lightState.takedown || (isAhPressed && isAhTakedownMode);

            document.getElementById('st-blue').className = 'status-dot' + (lightState.blueMain ? ' active-blue' : '');
            document.getElementById('st-red').className = 'status-dot' + (lightState.redPilot ? ' active-red' : '');
            document.getElementById('st-takedown').className = 'status-dot' + (effectiveTakedown ? ' active-white' : '');
            document.getElementById('st-alley').className = 'status-dot' + (lightState.alley ? ' active-white' : '');
            document.getElementById('st-wl').className = 'status-dot' + (lightState.wlPanel ? ' active-white' : '');

            const stCruise = document.getElementById('st-cruise');
            const labelCruise = document.getElementById('st-label-cruise');
            const labelAhMode = document.getElementById('st-label-ah-mode');

            if (lightState.blueMain) {
                labelCruise.classList.add('status-label-hidden');
                labelAhMode.classList.remove('status-label-hidden');
                stCruise.className = 'status-dot' + (isAhTakedownMode ? ' active-amber' : '');
            } else {
                labelAhMode.classList.add('status-label-hidden');
                labelCruise.classList.remove('status-label-hidden');
                stCruise.className = 'status-dot' + (isCruiseActive ? ' active-blue' : '');
            }

            const stSiren = document.getElementById('st-siren');
            const stLabel = document.getElementById('st-siren-label');
            if (isAhPressed) {
                stSiren.className = 'status-dot active-amber';
                stLabel.textContent = 'Syrena: AIR HORN';
            } else if (isSirenActive) {
                stSiren.className = 'status-dot active-amber';
                stLabel.textContent = 'Syrena: ' + sirenNames[sirenModes[currentModIndex]];
            } else {
                stSiren.className = 'status-dot';
                stLabel.textContent = 'Syrena: WYŁ';
            }
        }

        // =========================================================================
        // 3. GENERATORY BŁYSKÓW (Osobny wolniejszy zegar dla niebieskich i szybki dla czerwonego)
        // =========================================================================

        // --- A. ZEGAR ŚWIATEŁ NIEBIESKICH (Zwolniony do tempa z filmu: 75 ms / krok) ---
        // Dwa lewe niebieskie moduły (L1 i L2) zawsze świecą razem w Fazie A,
        // naprzemiennie z prawym modułem niebieskim (R1) w Fazie B.
        let blueFlashStep = 0;

        setInterval(() => {
            if (!lightState.blueMain) {
                const isCruiseActive = lightState.aux2 && !lightState.blueMain;
                modBlueL1.classList.remove('blue-on');
                modBlueL2.classList.remove('blue-on');
                modBlueR1.classList.remove('blue-on');
                glowLeft.style.opacity = isCruiseActive ? '0.28' : '0';
                glowRight.style.opacity = isCruiseActive ? '0.28' : '0';
                return;
            }

            const isBluePhaseA = (blueFlashStep === 0 || blueFlashStep === 2 || blueFlashStep === 4);
            const isBluePhaseB = (blueFlashStep === 6 || blueFlashStep === 8 || blueFlashStep === 10);

            modBlueL1.classList.toggle('blue-on', isBluePhaseA);
            modBlueL2.classList.toggle('blue-on', isBluePhaseA);
            modBlueR1.classList.toggle('blue-on', isBluePhaseB);

            glowLeft.style.opacity = isBluePhaseA ? '1' : '0';
            glowRight.style.opacity = isBluePhaseB ? '1' : '0';

            blueFlashStep = (blueFlashStep + 1) % 12;
        }, 75);

        // --- B. ZEGAR ŚWIATŁA CZERWONEGO "PILOT" (Zachowana dotychczasowa prędkość: 40 ms / krok) ---
        let redFlashStep = 0;

        setInterval(() => {
            if (!lightState.redPilot) {
                modPilotRed.classList.remove('red-on');
                glowRed.style.opacity = '0';
                return;
            }

            const isRedActive = (redFlashStep === 6 || redFlashStep === 8 || redFlashStep === 10);
            modPilotRed.classList.toggle('red-on', isRedActive);
            glowRed.style.opacity = isRedActive ? '1' : '0';

            redFlashStep = (redFlashStep + 1) % 12;
        }, 40);
    </script>
</body>
</html>
