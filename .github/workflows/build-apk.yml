name: Budowanie aplikacji Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Konfiguracja Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Przygotowanie plików i konfiguracja Capacitora
        run: |
          # Tworzymy folder tymczasowy www i kopiujemy pliki strony
          mkdir -p www
          rsync -av --exclude='www' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' ./ www/

          # Czyszczenie ewentualnych starych plików package.json przed inicjalizacją
          rm -f package.json package-lock.json

          # Inicjalizacja projektu i instalacja Capacitora
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # Tworzenie pliku konfiguracyjnego aplikacji
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "pl.kot1999.symulatoroswietlenia",
            "appName": "Symulator Oświetlenia Awaryjnego",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Generowanie natywnego projektu Android
          npx cap add android
          npx cap sync android

      - name: 5. Kompilacja pliku .apk (Gradle)
        run: |
          # Naprawa błędu "Duplicate class kotlin" - wykluczenie starych duplikatów jdk7/jdk8
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 6. Udostępnienie gotowego pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Symulator-Oswietlenia-Awaryjnego-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
