name: Budowanie aplikacji Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Konfiguracja Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Przygotowanie plików, ikony i konfiguracja Capacitora
        run: |
          # Tworzymy folder tymczasowy www i kopiujemy pliki strony
          mkdir -p www
          rsync -av --exclude='www' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' ./ www/

          # Czyszczenie starych plików package.json
          rm -f package.json package-lock.json

          # Inicjalizacja projektu i instalacja narzędzi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets sharp

          # Tworzenie pliku konfiguracyjnego aplikacji
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "pl.kot1999.symulatoroswietlenia",
            "appName": "Symulator Oświetlenia Awaryjnego",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Generowanie natywnego projektu Android
          npx cap add android

          # Przetwarzanie ikony icon.png z repozytorium
          if [ -f "icon.png" ]; then
            echo "Znaleziono icon.png - generowanie ikony aplikacji..."
            mkdir -p assets
            node -e '
              const sharp = require("sharp");
              (async () => {
                try {
                  await sharp("icon.png")
                    .resize(1024, 1024, { fit: "contain", background: "#ffffff" })
                    .toFormat("png")
                    .toFile("assets/icon.png");
                  console.log("Ikona pomyślnie przetworzona!");
                } catch (err) {
                  console.error("Błąd przetwarzania ikony:", err);
                  process.exit(1);
                }
              })();
            '
            npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          else
            echo "UWAGA: Nie znaleziono pliku icon.png w głównym katalogu."
          fi

          npx cap sync android

      - name: 5. Stały klucz podpisu i kompilacja pliku .apk (Gradle)
        run: |
          mkdir -p ~/.android
          if [ ! -f ".github/debug.keystore" ]; then
            echo "Generowanie stałego klucza podpisu..."
            keytool -genkey -v -keystore .github/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/debug.keystore
            git commit -m "Dodanie stalego klucza podpisu APK [skip ci]" || true
            git push || true
          fi
          cp .github/debug.keystore ~/.android/debug.keystore

          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

          cat << 'EOF' >> android/build.gradle
          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          # Zmiana nazwy pliku na pełną nazwę ze spacjami i polskimi znakami
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Symulator Oświetlenia Awaryjnego.apk"

      - name: 6. Udostępnienie gotowego pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Symulator-Oswietlenia-Awaryjnego-APK
          path: "android/app/build/outputs/apk/debug/Symulator Oświetlenia Awaryjnego.apk"
