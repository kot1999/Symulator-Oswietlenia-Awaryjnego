name: Budowanie aplikacji Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: 2. Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Konfiguracja Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Przygotowanie plików, ikony i konfiguracja Capacitora
        run: |
          # Tworzymy folder tymczasowy www i kopiujemy pliki strony
          mkdir -p www
          rsync -av --exclude='www' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' ./ www/

          # Czyszczenie ewentualnych starych plików package.json
          rm -f package.json package-lock.json

          # Inicjalizacja projektu i instalacja Capacitora wraz z generatorem ikon
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets

          # Tworzenie pliku konfiguracyjnego aplikacji
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "pl.kot1999.symulatoroswietlenia",
            "appName": "Symulator Oświetlenia Awaryjnego",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # Generowanie natywnego projektu Android
          npx cap add android

          # Wyszukiwanie pliku ikony w repozytorium i automatyczne generowanie ikon Androida
          ICON_FILE=""
          for f in icon.png icon.jpg icon.svg logo.png logo.jpg logo.svg favicon.png; do
            if [ -f "$f" ]; then
              ICON_FILE="$f"
              break
            fi
          done

          if [ -n "$ICON_FILE" ]; then
            echo "Znaleziono ikonę: $ICON_FILE - generowanie ikon aplikacji..."
            mkdir -p assets
            ICON_FILE="$ICON_FILE" node -e '
              const sharp = require("sharp");
              const icon = process.env.ICON_FILE;
              (async () => {
                await sharp(icon).resize(1024, 1024, { fit: "contain", background: "#ffffff" }).png().toFile("assets/icon.png");
                const logo = await sharp(icon).resize(600, 600, { fit: "contain", background: "#ffffff" }).png().toBuffer();
                await sharp({ create: { width: 2732, height: 2732, channels: 4, background: "#ffffff" } })
                  .composite([{ input: logo, gravity: "center" }]).png().toFile("assets/splash.png");
              })();
            '
            npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'
          else
            echo "UWAGA: Nie znaleziono pliku icon.png w repozytorium - użyto domyślnej ikony."
          fi

          npx cap sync android

      - name: 5. Stały klucz podpisu i kompilacja pliku .apk (Gradle)
        run: |
          # Tworzenie lub wczytywanie stałego klucza podpisu (aby aktualizacje działały bez konfliktu pakietów)
          mkdir -p ~/.android
          if [ ! -f ".github/debug.keystore" ]; then
            echo "Generowanie stałego klucza podpisu i zapisywanie w repozytorium..."
            keytool -genkey -v -keystore .github/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/debug.keystore
            git commit -m "Dodanie stalego klucza podpisu APK [skip ci]" || true
            git push || true
          fi
          cp .github/debug.keystore ~/.android/debug.keystore

          # Automatyczne podbijanie numeru wersji przy każdym nowym budowaniu
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/g" android/app/build.gradle

          # Naprawa błędu "Duplicate class kotlin"
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                  exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

          # Zmiana nazwy gotowego pliku na własną nazwę
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Symulator-Oswietlenia-Awaryjnego.apk

      - name: 6. Udostępnienie gotowego pliku APK do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Symulator-Oswietlenia-Awaryjnego-APK
          path: android/app/build/outputs/apk/debug/Symulator-Oswietlenia-Awaryjnego.apk
